name: Android viewer

on:
  pull_request:
    paths: ['client/**', '.github/workflows/android.yml']
  push:
    branches: ['feat/android-display-viewer']
    paths: ['client/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Shared policy and credential tests
        run: cargo test --manifest-path client/Cargo.toml -p betterframe-client-core -p betterframe-android-bridge --locked
      - name: Build both ABIs, unit tests and lint
        working-directory: client/android
        run: ./gradlew --no-daemon assembleDebug assembleRelease testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-viewer-build
          path: |
            client/android/app/build/outputs/apk/
            client/android/app/build/reports/
          if-no-files-found: warn
