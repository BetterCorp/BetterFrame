<script type="text/javascript">
  RED.nodes.registerType("bf-trigger-web-change", {
    category: "BetterFrame Triggers",
    color: "#a6d4ff",
    defaults: {
      name: { value: "" },
      config: { value: "", type: "bf-server-config", required: true },
      kiosk_id: { value: "" },
      display_id: { value: "" },
      view_id: { value: "" },
      entity_id: { value: "" },
      url_contains: { value: "" },
    },
    inputs: 0,
    outputs: 1,
    icon: "betterframe.svg",
    label: function () {
      return this.name || "web change";
    },
    paletteLabel: "Web Change Trigger",

<script type="text/html" data-template-name="bf-trigger-web-change">
  <div class="form-row">

    <input type="text" id="node-input-config" />
  </div>

    <label for="node-input-kiosk_id"><i class="fa fa-window-maximize"></i> Kiosk ID</label>
    <input type="text" id="node-input-kiosk_id" placeholder="(blank = all kiosks)" />
  </div>
  <div class="form-row">
    <label for="node-input-display_id"><i class="fa fa-desktop"></i> Display ID</label>

<script type="text/html" data-help-name="bf-trigger-web-change">
