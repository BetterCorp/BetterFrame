# BSB runtime configuration — template for Docker builds.
#
# Placeholders (${VAR}) are replaced by envsubst when the container starts.
# Inject secrets with runtime environment variables or their `_FILE` variants.
#
# For native (non-Docker) installs, copy to sec-config.yaml and
# replace ${VAR} placeholders with actual values.

default:
  observable:
    observable-default:
      plugin: observable-default
      enabled: true
      config: {}
  events:
    events-default:
      plugin: events-default
      enabled: true
  services:
    service-admin-http:
      package: betterframe
      plugin: service-admin-http
      enabled: true
      config:
        db:
          host: ${BF_PG_HOST}
          port: ${BF_PG_PORT}
          database: ${BF_PG_DB}
          user: ${BF_PG_USER}
          password: ${BF_PG_PASSWORD}
          poolMax: ${BF_PG_POOL_MAX}
        host: 0.0.0.0
        port: 18080
        dataDir: /var/lib/betterframe
        sessionIdleSeconds: 43200
        sessionMaxSeconds: 2592000
        loginLockoutThreshold: 8
        loginLockoutSeconds: 900
        argon2Memory: 65536
        argon2TimeCost: 3
        argon2Parallelism: 2
        cookieName: betterframe_session
        totpIssuer: BetterFrame
        noderedUrl: ${BF_NODERED_URL}
        selfUrl: ${BF_SELF_URL}
        systemdCredsDir: ""
        # Read from BF_FIRMWARE_SIGNING_KEY at runtime so multiline PEM is
        # never interpolated into YAML.
        firmwareSigningKey: ""
        firmwareImportApiKey: "${BF_FIRMWARE_IMPORT_API_KEY}"
        otaImportApiKey: "${BF_OTA_IMPORT_API_KEY}"

    service-api-http:
      package: betterframe
      plugin: service-api-http
      enabled: true
      config:
        db:
          host: ${BF_PG_HOST}
          port: ${BF_PG_PORT}
          database: ${BF_PG_DB}
          user: ${BF_PG_USER}
          password: ${BF_PG_PASSWORD}
          poolMax: ${BF_PG_POOL_MAX}
        host: 0.0.0.0
        port: 18081
        codeTtlSeconds: 600
        dataDir: /var/lib/betterframe
        argon2Memory: 65536
        argon2TimeCost: 3
        argon2Parallelism: 2
        cookieName: betterframe_session
        totpIssuer: BetterFrame
        noderedUrl: ${BF_NODERED_URL}
        mqttUrl: "${BF_MQTT_URL}"
        mqttUsername: "${BF_MQTT_USERNAME}"
        mqttPassword: "${BF_MQTT_PASSWORD}"
        mqttTopicPrefix: ${BF_MQTT_TOPIC_PREFIX}

    service-coordinator-ws:
      package: betterframe
      plugin: service-coordinator-ws
      enabled: true
      config:
        db:
          host: ${BF_PG_HOST}
          port: ${BF_PG_PORT}
          database: ${BF_PG_DB}
          user: ${BF_PG_USER}
          password: ${BF_PG_PASSWORD}
          poolMax: ${BF_PG_POOL_MAX}
        host: 0.0.0.0
        port: 18082
        dataDir: /var/lib/betterframe
        argon2Memory: 65536
        argon2TimeCost: 3
        argon2Parallelism: 2
        cookieName: betterframe_session
        totpIssuer: BetterFrame
        noderedUrl: ${BF_NODERED_URL}
