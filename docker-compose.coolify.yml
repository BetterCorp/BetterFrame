# BetterFrame Coolify variant — Coolify's Traefik fronts the stack, so
# no host port is published from the compose. Angie still receives traffic
# from Traefik on container port 80 (via the betterframe network).
#
# Point Coolify resource at this file instead of docker-compose.yml.
#
# Server config is rendered at container start from runtime environment and
# secret-file variables.

version: "3.8"

services:
  server:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.server
      args:
        BF_SERVER_VERSION: ${COOLIFY_GIT_COMMIT:-dev}
    container_name: betterframe-server
    restart: unless-stopped
    environment:
      - TZ=UTC
      - BF_PG_HOST=postgres
      - BF_PG_PORT=5432
      - BF_PG_DB=${BF_PG_DB:-betterframe}
      - BF_PG_USER=${BF_PG_USER:-betterframe}
      - BF_PG_PASSWORD=${BF_PG_PASSWORD:?set BF_PG_PASSWORD}
      - BF_NODERED_URL=http://nodered:1880
      - BF_SELF_URL=http://server:18080
      - BF_NODERED_MANAGER_SECRET=${BF_NODERED_MANAGER_SECRET:?set BF_NODERED_MANAGER_SECRET to at least 32 characters}
    volumes:
      - betterframe-data:/var/lib/betterframe
    expose:
      - "18080"
      - "18081"
      - "18082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:18080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - betterframe

  angie:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.angie
    container_name: betterframe-angie
    restart: unless-stopped
    depends_on:
      - server
      - nodered
    # No `ports:` — Coolify's Traefik routes ${SERVICE_FQDN_ANGIE_80} → 80.
    expose:
      - "80"
    networks:
      - betterframe

  nodered:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.nodered
    container_name: betterframe-nodered
    restart: unless-stopped
    environment:
      - TZ=UTC
      - BF_NODERED_MANAGER_SECRET=${BF_NODERED_MANAGER_SECRET:?set BF_NODERED_MANAGER_SECRET to at least 32 characters}
      - BF_NODERED_MAX_TENANTS=50
      - BF_NODERED_TENANT_MEMORY_MB=${BF_NODERED_TENANT_MEMORY_MB:-256}
    volumes:
      - nrdata:/data
    expose:
      - "1880"
    healthcheck:
      # Node-RED root admin path returns 200 once the runtime is up.
      test: ["CMD-SHELL", "wget -qO- http://localhost:1880/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - betterframe

  postgres:
    image: postgres:18-alpine
    container_name: betterframe-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${BF_PG_USER:-betterframe}
      - POSTGRES_PASSWORD=${BF_PG_PASSWORD:?set BF_PG_PASSWORD}
      - POSTGRES_DB=${BF_PG_DB:-betterframe}
    volumes:
      - pgdata:/var/lib/postgresql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BF_PG_USER:-betterframe}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - betterframe

volumes:
  betterframe-data:
  nrdata:
  pgdata:

networks:
  betterframe:
    driver: bridge
