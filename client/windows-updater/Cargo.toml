[package]
name = "betterframe-windows-updater"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only OR Commercial"

[dependencies]
betterframe-client-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["pem"] }
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography",
  "Win32_System_Services", "Win32_System_Threading", "Win32_System_Environment",
  "Win32_System_RemoteDesktop", "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ApplicationInstallationAndServicing", "Win32_Storage_FileSystem",
] }
