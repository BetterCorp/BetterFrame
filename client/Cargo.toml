[workspace]
members = ["core"]
resolver = "2"

[package]
name = "betterframe-client"
version = "0.1.0"
edition = "2024"
description = "BetterFrame client for Linux and Windows"
license = "AGPL-3.0-only OR Commercial"

[dependencies]
betterframe-client-core = { path = "core" }
gstreamer = "0.23"
gstreamer-video = "0.23"
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "net", "sync"] }
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hostname = "0.4"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
url = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
base64 = "0.22"
aes-gcm = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["pem"] }
urlencoding = "2"
sha1 = "0.10"
md5 = "0.7"
hkdf = "0.12"
axum = "0.7"
tower = "0.5"
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hex = "0.4"
rand = "0.8"
gtk4 = { version = "0.9", features = ["v4_14"] }
gdk-pixbuf = "0.20"
gst-plugin-gtk4 = { version = "0.13", features = ["static", "dmabuf", "waylandegl"] }
webkit6 = "0.4"
tokio-gpiod = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.61", features = [
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
] }
wry = { version = "0.56", default-features = false, features = ["os-webview"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = { version = "0.1.31", default-features = false }
