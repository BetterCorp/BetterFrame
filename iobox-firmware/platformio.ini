[platformio]
default_envs = iobox_wifi

[env]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
  arduino-libraries/Ethernet@^2.0.2
build_flags =
  -D BF_IOBOX_FW_VERSION=\"0.1.0\"
  -D BF_DEFAULT_SERVER_URL=\"https://betterframe.local\"
  -D BF_AP_TIMEOUT_MS=300000
  -D BF_STATUS_LED_PIN=2
  -D BF_PIR_PIN=-1
  -D BF_BUTTON_PIN=-1
  -D BF_RS485_RX_PIN=-1
  -D BF_RS485_TX_PIN=-1
  -D BF_RS485_DE_PIN=-1

[env:iobox_wifi]
extends = env
build_flags =
  ${env.build_flags}
  -D BF_ETHERNET_VARIANT=0
  -D BF_MODEL_HINT=\"ioBOX-KB\"

[env:iobox_eth]
extends = env
build_flags =
  ${env.build_flags}
  -D BF_ETHERNET_VARIANT=1
  -D BF_MODEL_HINT=\"ioBOX-KB-E\"
  -D BF_ETH_CS_PIN=10
  -D BF_ETH_SPI_SCK_PIN=12
  -D BF_ETH_SPI_MISO_PIN=13
  -D BF_ETH_SPI_MOSI_PIN=11
