[package]
name = "betterframe-android-bridge"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only OR Commercial"

[lib]
name = "betterframe_android_bridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
betterframe-client-core = { path = "../core" }
serde_json = "1"
url = "2"
base64 = "0.22"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
jni = { version = "0.21", default-features = false }
