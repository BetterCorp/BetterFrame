<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>BetterFrame Operator Console</title>
  <link rel="stylesheet" href="/operator/app.css">
</head>
<body>
  <section id="enroll" class="enroll hidden">
    <form id="enroll-form" class="panel enroll-card">
      <div class="brand">BetterFrame</div>
      <h1>Enroll this operator station</h1>
      <p>Enter the single-use code generated by a BetterFrame administrator.</p>
      <input id="enroll-code" autocomplete="one-time-code" maxlength="8" required autofocus>
      <button type="submit" class="primary">Enroll station</button>
      <p id="enroll-error" class="error"></p>
    </form>
  </section>

  <main id="console" class="console hidden">
    <aside class="sidebar panel">
      <div class="brand">BetterFrame <span>Operator</span></div>
      <input id="search" type="search" placeholder="Camera, client, site, zone or number" autocomplete="off">
      <nav class="filters">
        <button data-filter="all" class="active">All</button>
        <button data-filter="favorites">Favorites</button>
        <button data-filter="recent">Recent</button>
      </nav>
      <div id="camera-list" class="camera-list"></div>
      <a href="/operator/work" class="work-link">Open operational workspace →</a>
    </aside>

    <section class="workspace">
      <header class="topbar panel">
        <div><h1 id="camera-name">Select a camera</h1><div id="camera-meta" class="muted"></div></div>
        <div class="top-actions">
          <button id="favorite" title="Favorite">☆</button>
          <button id="previous" title="Previous camera">← Previous</button>
          <button id="next" title="Next camera">Next →</button>
        </div>
      </header>

      <div class="video-shell panel">
        <video id="video" autoplay muted playsinline></video>
        <div id="video-state" class="video-state">Select a camera to preview</div>
        <div class="stream-switch"><button data-stream="main" class="active">Main</button><button data-stream="sub">Sub</button></div>
      </div>

      <section id="controls-grid" class="controls-grid">
        <div id="ptz-controls" class="panel control-card hidden">
          <h2>PTZ</h2>
          <div class="ptz-pad">
            <button data-ptz="0,1,0">▲</button>
            <button data-ptz="-1,0,0">◀</button>
            <button data-ptz-stop>■</button>
            <button data-ptz="1,0,0">▶</button>
            <button data-ptz="0,-1,0">▼</button>
          </div>
          <div class="zoom"><button data-ptz="0,0,-1">− Zoom</button><button data-ptz="0,0,1">+ Zoom</button></div>
          <select id="preset"><option value="">Preset…</option></select>
          <div class="joystick-row"><button id="connect-hid">Connect joystick</button><span id="hid-state" class="muted">Not connected</span></div>
        </div>

        <div class="panel control-card wall-card">
          <h2>Wall control</h2>
          <div id="wall-buttons" class="wall-buttons"></div>
          <label>Target tile<select id="wall-cell"><option value="">First empty tile</option></select></label>
          <div class="duration-row"><button data-duration="30">30s</button><button data-duration="60" class="active">60s</button><button data-duration="120">120s</button><button data-duration="pin">Pin</button></div>
          <div class="wall-actions"><button id="wall-send">Send to selected tile</button><button id="wall-fullscreen">Full-screen</button><button id="wall-clear">Clear display</button><button id="wall-restore">Restore layout</button></div>
          <p id="wall-state" class="muted"></p>
        </div>
      </section>
    </section>
  </main>
  <script src="/operator/app.js" defer></script>
</body>
</html>
