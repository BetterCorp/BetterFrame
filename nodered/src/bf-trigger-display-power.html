<script type="text/javascript">
  RED.nodes.registerType("bf-trigger-display-power", {
    category: "BetterFrame Triggers",
    color: "#a6d4ff",
    defaults: {
      name: { value: "" },
      config: { value: "", type: "bf-server-config", required: true },
      display_id: { value: "" },
    },
    inputs: 0,
    outputs: 1,
    icon: "betterframe.svg",
    label: function () {
      return this.name || "display power";
    },
    paletteLabel: "Display Power Trigger",
  });
</script>

<script type="text/html" data-template-name="bf-trigger-display-power">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="(optional)" />
  </div>
  <div class="form-row">
    <label for="node-input-config"><i class="fa fa-cog"></i> BF</label>
    <input type="text" id="node-input-config" />
  </div>
  <div class="form-row">
    <label for="node-input-display_id"><i class="fa fa-desktop"></i> Display ID</label>
    <input type="text" id="node-input-display_id" pattern="[0-9a-f-]+" placeholder="(blank = all displays)" />
  </div>
  <div class="form-tips">
    Fires on <code>display.power.changed</code> (wake/standby).
    Listens on <code>POST /api/internal/display.power.changed</code> internally — no upstream
    <code>http in</code> node required.
    Emits <code>msg.payload = {display_id, kiosk_id, state}</code> for the selected tenant.
    Leave Display ID blank to receive events from all displays.
  </div>
</script>

<script type="text/html" data-help-name="bf-trigger-display-power">
  <p>Fires when a display's power state changes (admin wake/standby command).</p>
  <p>Listens on <code>POST /api/internal/display.power.changed</code> internally — no upstream
  <code>http in</code> node needed. The BetterFrame server's nodered-bridge POSTs
  events to that path directly.</p>
  <p>Select a <b>BF</b> config to scope this trigger to one tenant.</p>
  <p>Optional <b>Display ID</b> filter limits this node to a single display.</p>
</script>
